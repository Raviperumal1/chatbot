version: "3.8"

services:
  backend:
    build: .
    container_name: zenfuture_backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      # Override the DB URL inside docker to point to the host machine's existing MySQL database
      - DATABASE_URL=mysql+pymysql://zenfuture_admin:ZenF@2025@host.docker.internal:3306/zenfuture_db
      # Point Ollama to the host machine (if running native on host) or network
      - OLLAMA_HOST=http://host.docker.internal:11434
    volumes:
      - ./chroma_store:/app/chroma_store
    extra_hosts:
      # This allows the container to resolve 'host.docker.internal' to the actual Linux host machine IP
      - "host.docker.internal:host-gateway"
