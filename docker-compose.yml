version: "3.8"

services:
  postgres:
    image: postgres:16
    container_name: zenfuture_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: zenfuture
      POSTGRES_PASSWORD: zenfuture
      POSTGRES_DB: zenfuture_chatbot
    ports:
      - "5432:5432"
    volumes:
      - zenfuture_pg_data:/var/lib/postgresql/data

volumes:
  zenfuture_pg_data:
